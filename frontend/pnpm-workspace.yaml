overrides:
  fast-uri: ">=3.1.2"
  prismjs: ^1.30.0
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11, while eslint still asks
  # for ^10. Drop this once eslint accepts minimatch 11.
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1

auditConfig:
  ignoreGhsas:
    # deepmerge has no patched release (4.3.1 is the latest), and only
    # @sveltejs/vite-plugin-svelte uses it, at build time. Drop this once a
    # fixed deepmerge is out.
    - GHSA-gcqx-w48m-w2h4

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - tmp
  - tmp@0.2.7
  - vite@8.0.16
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - undici@7.28.0
  - brace-expansion@1.1.16
  - js-yaml@4.3.0
  - fast-uri@4.1.1
  - fast-uri@4.0.1
