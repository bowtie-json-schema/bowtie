# This workflow is a separate workflow from `report.yml` for regenerating the versioned report data needed for Bowtie's UI and `bowtie trend`.
# It retests all of Bowtie's supported implementations for all their multiple versions listed in `matrix-versions.json` file if one exists for them.
name: Collect New Versioned Test Results

permissions:
  contents: read

on:
  schedule:
    # every Sunday at 23:30 UTC (45 minutes before a report workflow is scheduled)
    - cron: "30 23 * * 0"
  workflow_dispatch:
    inputs:
      implementation:
        description: The name of an implementation.
        required: false
        type: string

concurrency:
  group: versioned-reports
  cancel-in-progress: true

env:
  GH_ORGANIZATION: ${{ github.repository_owner }}
jobs:
  list-implementations:
    name: List Implementations
    runs-on: ubuntu-latest
    outputs:
      implementations: ${{ steps.implementations-matrix.outputs.implementations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: ./

      - name: List all Bowtie Supported Implementations having a "matrix-versions.json" file
        id: implementations-matrix
        env:
          GH_TOKEN: ${{ github.token }} # because we use gh CLI in the script (https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-github-cli-in-workflows)
          INPUTS_IMPLEMENTATION: ${{ inputs.implementation }}
        run: |
          implementation=${INPUTS_IMPLEMENTATION}
          IMPLEMENTATIONS=$(bowtie filter-implementations --format json)
          MATRIX="[]"
          if [ -n "$implementation" ]; then
            if echo "$IMPLEMENTATIONS" | jq -e --arg impl "$implementation" 'index($impl) != null' > /dev/null; then
              if [ -f "implementations/$implementation/matrix-versions.json" ]; then
                MATRIX=$(echo $MATRIX | jq --arg impl "$implementation" '. + [$impl]')
              else
                echo "No \`matrix-versions.json\` file found for implementation ('$implementation')."
                exit 1
              fi
            else
              echo "No such implementation ('$implementation') found. Please provide a correct implementation name."
              echo "To see a list of all Bowtie supported implementations, run \`bowtie filter-implementations\`."
              exit 1
            fi
          else
            for impl in $(echo "$IMPLEMENTATIONS" | jq -r '.[]'); do
              if [ -f "implementations/$impl/matrix-versions.json" ]; then
                MATRIX=$(echo $MATRIX | jq --arg impl "$impl" '. + [$impl]')
              elif [ ! -d "implementations/$impl" ]; then
                echo "Collecting versions for remote impl $impl"
                versions=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  /repos/$GH_ORGANIZATION/$impl/git/matching-refs/tags/harness-release- | jq -c)

                if [ "$versions" != "[]" ]; then
                  MATRIX=$(echo $MATRIX | jq --arg impl "$impl" '. + [$impl]')
                fi
              fi
            done
          fi
          echo "implementations=$(echo $MATRIX | jq -c .)" >> $GITHUB_OUTPUT

  regenerate-versioned-reports:
    name: Generate Versioned Reports
    needs: list-implementations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: ${{ fromJson(needs.list-implementations.outputs.implementations) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: ./

        # just so that we don't get rate limited (429)
      - name: Checkout JSON Schema Test Suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: json-schema-org/JSON-Schema-Test-Suite
          path: json-schema-test-suite
          persist-credentials: false

      - name: Generate versioned reports for ${{ matrix.implementation }}
        env:
          # Lets bowtie list an extracted harness's version tags un-throttled.
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          impl=${MATRIX_IMPLEMENTATION}
          # bowtie discovers an extracted harness's versions from its
          # harness-release-* tags on its own; the current image plus every
          # discovered version is collected, each keyed by the version the image
          # reports, unavailable ones skipped. The few in-repo harnesses instead
          # pin their versions in a committed matrix-versions.json we pass through.
          images="-i image:$impl"
          if [ -f "implementations/$impl/matrix-versions.json" ]; then
            for version in $(jq -r '.[]' "implementations/$impl/matrix-versions.json"); do
              images="$images -i image:$impl:$version"
            done
          fi
          bowtie site collect --versioned $images \
            --suite ./json-schema-test-suite \
            --output "$impl"

      # This is useful to debug whether Bowtie accidentally fetched some huge
      # number of container images.
      - name: Show what images we fetched
        run: docker images
        if: always()

      # FIXME: We ignore for now as now this exits unsuccessfully if there
      #        are *test* failures
      - name: Check that all Generated Versioned Reports of ${{ matrix.implementation }} are Valid
        run: |
          impl=${MATRIX_IMPLEMENTATION}
          # Summarize only the reports that were actually generated (versions whose image
          # was unavailable are skipped above and have no directory).
          for version_dir in "$impl"/v*/; do
            [ -d "$version_dir" ] || continue
            for dialect_file in "$version_dir"*.json; do
              [ -e "$dialect_file" ] || continue
              bowtie summary --show failures "$dialect_file" --format markdown >> $GITHUB_STEP_SUMMARY
            done
          done
        continue-on-error: true
        env:
          MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.implementation }}
          path: |
            ${{ matrix.implementation }}

  combine-all-versioned-reports:
    name: Combine Versioned Reports
    # Publish whatever succeeded even if some implementations failed, rather than
    # letting a single failure gate (and drop) every implementation's trend.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: regenerate-versioned-reports
    steps:
      - name: Download this run's freshly generated reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: fresh

      - name: Download the last published versioned reports
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: versioned-report.yml
          branch: main
          name: implementations
          path: implementations
        continue-on-error: true # nothing is published yet on the very first run

      - name: Overlay this run's reports onto the last published set
        run: |
          # Replace each implementation that was (re)generated this run, and keep
          # the previously published trend for any that failed and produced no
          # fresh reports -- so a transient failure never wipes an implementation.
          shopt -s nullglob
          mkdir -p implementations
          for dir in fresh/*/; do
            impl=$(basename "$dir")
            rm -rf "implementations/$impl"
            cp -r "$dir" "implementations/$impl"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implementations
          path: implementations
