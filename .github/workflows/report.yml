# This workflow is the main workflow for regenerating the data needed for Bowtie's UI.
# It retests all of Bowtie's supported implementations, publishing the reports (and other auxiliary metadata) for use in the frontend.
name: Collect New Test Results

on:
  workflow_call:
    inputs:
      bowtie-version:
        type: string
        required: false
        default: ""
  workflow_dispatch:
  schedule:
    # Every 6 hours, at 50 past the hour -- after the harnesses publish their
    # own reports near the start of the same hour, so we collect fresh reports
    # pinned to the same per-hour suite commit.
    - cron: "50 */6 * * *"

permissions:
  contents: read
  # These are needed at workflow level because reusable workflow permissions
  # are intersected with the caller's — job-level permissions alone aren't enough.
  pages: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: "report"
  cancel-in-progress: true

jobs:
  matrix:
    name: Collect Matrix Parameters
    runs-on: ubuntu-latest
    outputs:
      implementations: ${{ steps.implementations-matrix.outputs.implementations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: $/
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Collect supported implementations
        id: implementations-matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'implementations=%s\n' "$(bowtie filter-implementations --format json | jq -c '.')" >> $GITHUB_OUTPUT

  collect:
    name: Collect Per-Implementation Reports
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: ${{ fromJson(needs.matrix.outputs.implementations) }}

    steps:
      - name: Download this implementation's published report
        id: download
        # Prefer the harness's own published report, produced by its
        # harness-report.yml against the same per-hour suite commit.
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          if gh release download report \
               --repo "bowtie-json-schema/${MATRIX_IMPLEMENTATION}" \
               --dir reports --clobber 2>/dev/null; then
            echo "Using ${MATRIX_IMPLEMENTATION}'s published report."
          else
            echo "No published report for ${MATRIX_IMPLEMENTATION}; will run the suite."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      # Only implementations without a published report -- the in-repo direct
      # connectables, and any harness not reporting yet -- need Bowtie to run
      # the suite here, so most jobs skip checking it out and installing it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.download.outputs.fallback == 'true'
        with:
          persist-credentials: false

      - name: Install Bowtie
        if: steps.download.outputs.fallback == 'true'
        uses: $/
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Run the suite
        if: steps.download.outputs.fallback == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          rm -rf reports
          bowtie site collect -i "${MATRIX_IMPLEMENTATION}" --output reports

      # This is useful to debug whether Bowtie accidentally fetched some huge
      # number of container images.
      - name: Show what images we fetched
        if: ${{ always() && steps.download.outputs.fallback == 'true' }}
        run: docker images

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: impl-report-${{ matrix.implementation }}
          path: reports/
          if-no-files-found: ignore

  site:
    name: Assemble Site
    if: ${{ !cancelled() }}
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: $/
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Download All Implementation Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: impl-report-*
          path: collected/

      - name: Combine into Site Data
        # Combines the per-implementation reports for each dialect and writes
        # implementations.json, badges and the public API data -- all read
        # from the reports, so no implementations are started here.
        run: bowtie site combine collected/* --output site

        # FIXME: We ignore for now as this exits unsuccessfully if there are
        #        *test* failures.
      - name: Summarize Failures
        continue-on-error: true
        run: |
          for report in site/*.json; do
            case "${report}" in
              site/implementations.json) continue ;;
            esac
            bowtie summary --show failures "${report}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          done

      # The real-world benchmark results the benchmarks page shows, from the
      # latest run of sourcemeta-research/jsonschema-benchmark on its runner
      # pool. Its bucket allows no other origins, so the site serves a copy.
      # Without them only that page is affected, so the site still deploys.
      - name: Include the real-world benchmark results
        run: |
          mkdir -p site/jsonschema-benchmark
          if ! curl --fail --silent --show-error --retry 3 \
              --output site/jsonschema-benchmark/data.json \
              https://sourcemeta-research-jsonschema-benchmark.s3.eu-central-003.backblazeb2.com/latest/data.json; then
            rm -f site/jsonschema-benchmark/data.json
            echo "::warning::The real-world benchmark results could not be downloaded; the benchmarks page will say so."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: site

  redeploy-frontend:
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    permissions:
      contents: read # for actions/checkout in ui.yml
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment originates from this workflow
    needs: site
    uses: $/.github/workflows/ui.yml
    with:
      report_artifact_in_scope: true
