# This workflow is the main workflow for regenerating the data needed for Bowtie's UI.
# It retests all of Bowtie's supported implementations, publishing the reports (and other auxiliary metadata) for use in the frontend.
name: Collect New Test Results

on:
  workflow_call:
    inputs:
      bowtie-version:
        type: string
        required: false
        default: ""
      report_benchmark_artifact_in_scope:
        required: false
        type: boolean
  workflow_dispatch:
  schedule:
    # Every 6 hours, at 15 past the hour
    - cron: "15 */6 * * *"

permissions:
  contents: read
  # These are needed at workflow level because reusable workflow permissions
  # are intersected with the caller's — job-level permissions alone aren't enough.
  pages: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: "report"
  cancel-in-progress: true

jobs:
  matrix:
    name: Collect Matrix Parameters
    runs-on: ubuntu-latest
    outputs:
      implementations: ${{ steps.implementations-matrix.outputs.implementations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: ./
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Collect supported implementations
        id: implementations-matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'implementations=%s\n' "$(bowtie filter-implementations --format json | jq -c '.')" >> $GITHUB_OUTPUT

  collect:
    name: Collect Per-Implementation Reports
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: ${{ fromJson(needs.matrix.outputs.implementations) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: ./
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Collect Reports
        # Bowtie runs the whole suite for every dialect the implementation
        # supports in a single command, so the workflow needs no per-dialect
        # loop and no test-suite URLs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}
        run: bowtie site collect -i "${MATRIX_IMPLEMENTATION}" --output reports

      # This is useful to debug whether Bowtie accidentally fetched some huge
      # number of container images.
      - name: Show what images we fetched
        run: docker images
        if: always()

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: impl-report-${{ matrix.implementation }}
          path: reports/
          if-no-files-found: ignore

  site:
    name: Assemble Site
    if: ${{ !cancelled() }}
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bowtie
        uses: ./
        with:
          version: ${{ inputs.bowtie-version }}

      - name: Download All Implementation Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: impl-report-*
          path: collected/

      - name: Combine into Site Data
        # Combines the per-implementation reports for each dialect and writes
        # implementations.json and the public API data -- all read from the
        # reports, so no implementations are started here.
        run: bowtie site combine collected/* --output site

      - name: Generate Badges
        run: bowtie badges --site site

        # FIXME: We ignore for now as this exits unsuccessfully if there are
        #        *test* failures.
      - name: Summarize Failures
        continue-on-error: true
        run: |
          for report in site/*.json; do
            case "${report}" in
              site/implementations.json) continue ;;
            esac
            bowtie summary --show failures "${report}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Include Benchmark Report from local artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.report_benchmark_artifact_in_scope == true
        with:
          name: benchmarks
          path: site/benchmarks

      # if called as a separate workflow
      - name: Download latest Benchmark Report
        if: inputs.report_benchmark_artifact_in_scope == false
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: benchmark.yml
          branch: main
          name: benchmarks
          path: site/benchmarks
        id: download_benchmark
        continue-on-error: true

      - name: Fallback for missing benchmarks
        if: steps.download_benchmark.outcome == 'failure'
        run: |
          mkdir -p ./site/benchmarks
          cd site/benchmarks
          curl -O https://bowtie.report/benchmarks/draft3.json
          curl -O https://bowtie.report/benchmarks/draft4.json
          curl -O https://bowtie.report/benchmarks/draft6.json
          curl -O https://bowtie.report/benchmarks/draft7.json
          curl -O https://bowtie.report/benchmarks/draft2019-09.json
          curl -O https://bowtie.report/benchmarks/draft2020-12.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: site

  redeploy-frontend:
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    permissions:
      contents: read # for actions/checkout in ui.yml
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment originates from this workflow
    needs: site
    uses: ./.github/workflows/ui.yml
    with:
      report_artifact_in_scope: true
